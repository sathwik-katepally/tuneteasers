<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TuneTeasers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Outfit:wght@400;600;700;800&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
:root {
  --bg:#150A20; --surface:#251337; --surface2:#2F1A45;
  --cream:#FFF3E2; --dim:#B9A6CE; --marigold:#FFB627; --rose:#FF4D8D; --teal:#2EC4B6;
}
body {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -200px, #2B1445 0%, var(--bg) 60%) var(--bg);
  color: var(--cream);
  font-family: 'Outfit', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 16px 40px;
}
#root, .wrap { width: 100%; max-width: 440px; }
.display { font-family: 'Bricolage Grotesque', 'Outfit', sans-serif; }
h1 { font-family:'Bricolage Grotesque',sans-serif; font-size: 44px; font-weight: 800; line-height:1.05; margin: 8px 0 4px; }
.eyebrow { font-size:13px; letter-spacing:3px; color:var(--marigold); font-weight:700; }
.sub { color: var(--dim); font-size: 15px; }
.card { background: var(--surface); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
.label { font-size:13px; font-weight:700; color:var(--dim); margin-bottom:10px; letter-spacing:1px; }
.chips { display:flex; gap:8px; }
.chip {
  flex:1; padding:12px 8px; border-radius:14px; border:2px solid var(--surface2);
  background:var(--surface); color:var(--dim); font-weight:700; font-size:14px;
  cursor:pointer; text-align:center; font-family:'Outfit',sans-serif;
}
.chip.on-rose { border-color:var(--rose); background:#FF4D8D22; color:var(--rose); }
.chip.on-teal { border-color:var(--teal); background:#2EC4B622; color:var(--teal); }
.chip.on-gold { border-color:var(--marigold); background:#FFB62722; color:var(--marigold); }
.btn {
  width:100%; border:none; border-radius:16px; padding:16px 20px;
  font-size:17px; font-weight:700; font-family:'Outfit',sans-serif; cursor:pointer;
}
.btn:disabled { opacity:.55; }
.btn-gold { background:var(--marigold); color:#1A0E28; }
.btn-rose { background:var(--rose); color:var(--cream); }
.btn-teal { background:var(--teal); color:#1A0E28; }
.btn-dark { background:var(--surface2); color:var(--cream); }
.btn-ghost {
  background:transparent; color:var(--dim); border:1.5px solid var(--surface2);
  font-size:15px; font-weight:600;
}
.gap { height: 10px; }
input[type=text] {
  flex:1; background:var(--surface2); border:none; border-radius:12px;
  padding:12px 14px; color:var(--cream); font-size:16px; font-family:'Outfit',sans-serif;
}
input:focus, button:focus-visible { outline:2px solid var(--marigold); outline-offset:2px; }
.prow { display:flex; gap:8px; margin-bottom:8px; }
.xbtn { background:var(--surface2); border:none; border-radius:12px; width:46px; color:var(--dim); font-size:18px; cursor:pointer; }
.center { text-align:center; }
.pulse { animation: pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes fill { from{width:0} to{width:100%} }
@media (prefers-reduced-motion: reduce){ .spinning{ animation:none !important; } .pulse{ animation:none; } }
.disc-wrap { position:relative; width:220px; height:220px; margin:8px auto; }
.disc {
  width:220px; height:220px; border-radius:50%;
  background: repeating-radial-gradient(circle at 50% 50%, #1C0F2B 0px, #1C0F2B 6px, #241335 7px, #241335 13px);
  border:6px solid var(--surface2);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 30px #00000055; overflow:hidden;
  background-size: cover; background-position: center;
}
.disc.spinning { border-color:var(--marigold); animation:spin 2.4s linear infinite; box-shadow:0 0 60px #FFB62744; }
.disc-hole {
  width:64px; height:64px; border-radius:50%; background:var(--rose);
  display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:800; color:#1A0E28; font-family:'Bricolage Grotesque',sans-serif;
}
.progress { height:6px; border-radius:3px; background:var(--surface2); overflow:hidden; margin:0 30px 14px; }
.progress > div { height:100%; background:var(--marigold); border-radius:3px; }
.turnbar {
  background: linear-gradient(135deg, #FF4D8D33, #FFB62722);
  border:1.5px solid #FF4D8D55; border-radius:18px; padding:12px 16px;
  text-align:center; margin-bottom:8px;
}
.turnbar .tag { font-size:12px; color:var(--dim); font-weight:700; letter-spacing:2px; }
.turnbar .who { font-family:'Bricolage Grotesque',sans-serif; font-size:26px; font-weight:800; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.scorebtn { background:var(--surface); border:none; border-radius:12px; padding:8px 14px; color:var(--marigold); font-weight:700; font-size:13px; cursor:pointer; font-family:'Outfit',sans-serif; }
.boardrow { display:flex; justify-content:space-between; padding:6px; font-size:15px; }
.answer-title { font-family:'Bricolage Grotesque',sans-serif; font-size:24px; font-weight:800; line-height:1.15; }
.answer-artist { color:var(--marigold); font-weight:600; margin-top:4px; font-size:15px; }
.answer-album { color:var(--dim); font-size:13px; margin-top:2px; }
.row2 { display:flex; gap:10px; }
.row2 .btn { flex:1; }
.footnote { text-align:center; color:var(--dim); font-size:12px; margin-top:18px; }
.footnote a { color:var(--dim); }
.notice { text-align:center; color:var(--dim); font-size:12px; margin:8px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.19.3";
import { useState, useEffect } from "https://esm.sh/preact@10.19.3/hooks";
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(h);

/* ═══════ Data & filters ═══════ */
const SAAVN_BASES = [
  "https://saavn-api.nandanvarma.com/api",
  "https://saavn.dev/api",
];
const SAAVN_QUERIES = {
  bolly: ["bollywood hits","hindi hit songs","Arijit Singh hits","Pritam hits","best of bollywood","hindi songs 2010s","hindi songs 2020s","Shreya Ghoshal hindi","A R Rahman hindi","hindi romantic hits","hindi dance hits","Atif Aslam hits"],
  telugu: ["telugu hits","telugu hit songs","top telugu songs","Sid Sriram telugu","Devi Sri Prasad hits","telugu songs 2010s","telugu songs 2020s","Thaman hits","Anirudh telugu","telugu melody hits","telugu mass hits","tollywood hits"],
};
const ITUNES_TERMS = {
  bolly: ["Arijit Singh","Pritam songs","Shreya Ghoshal hindi","A R Rahman hindi","Amit Trivedi","Vishal Shekhar","Sonu Nigam hindi","Atif Aslam hindi","Jubin Nautiyal","Mohit Chauhan","Sachin Jigar","Badshah hindi"],
  telugu: ["Sid Sriram telugu","Devi Sri Prasad hits","Thaman S telugu","Anirudh telugu songs","Mickey J Meyer telugu","Gopi Sundar telugu","M M Keeravani telugu","Armaan Malik telugu","Anurag Kulkarni","telugu hit songs","Kaala Bhairava","Mangli telugu"],
};
const ITUNES_LANG_OK = { bolly:["bollywood","hindi"], telugu:["telugu","tollywood"] };
const EXCLUDE_RX = /(remix|mashup|lo-?fi|slowed|reverb|medley|unplugged|acoustic|cover|karaoke|instrumental|\bbgm\b|jukebox|revisited|reprise|redux|\bclub\b|\bdj\b|mix\b|8d\b|sped up|lounge|female version|male version)/i;

/* ═══════ Small utils ═══════ */
const de = s => { const t=document.createElement("textarea"); t.innerHTML=s||""; return t.value; };
const stripParens = s => s.replace(/[\(\[].*?[\)\]]/g,"").replace(/\s+/g," ").trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function safeUrl(u){
  if (typeof u !== "string") return null;
  if (/^https:\/\//i.test(u)) return u;
  if (/^http:\/\//i.test(u)) return "https://" + u.slice(7);
  return null;
}

/* ═══════ Persistence (auto-save on every change, auto-resume on load) ═══════ */
const LS_KEY = "tuneteasers_v6";
const LS_PLAYED = "tt_played";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

const DEFAULTS = {
  screen: "setup",
  settings: { mix:"both", sound:"inst", snippetLen:10 },
  players: [{name:"Player 1",score:0},{name:"Player 2",score:0}],
  game: null, // { queue, trackIdx, turn, round, totalSongs, source }
};
function sanitizeTrack(t){
  const stream = safeUrl(t && t.stream); if (!stream) return null;
  return {
    title: String(t.title||"").slice(0,120),
    artist: String(t.artist||"").slice(0,120),
    album: String(t.album||"").slice(0,120),
    art: safeUrl(t.art),
    stream,
    duration: parseInt(t.duration)||200,
    year: parseInt(t.year)||0,
    lang: t.lang==="telugu" ? "telugu" : "bolly",
    hook: !!t.hook, // true when the stream is a mid-song preview clip, not the intro
  };
}
function loadPersisted(){
  const raw = lsGet(LS_KEY);
  if (!raw) return DEFAULTS;
  const s = { ...DEFAULTS };
  const set = raw.settings || {};
  s.settings = {
    mix: ["bolly","telugu","both"].includes(set.mix) ? set.mix : "both",
    sound: ["inst","full"].includes(set.sound) ? set.sound : "inst",
    snippetLen: [5,10,15].includes(set.snippetLen) ? set.snippetLen : 10,
  };
  if (Array.isArray(raw.players) && raw.players.length)
    s.players = raw.players.slice(0,8).map(p=>({ name:String(p.name||"Player").slice(0,24), score:Math.max(0,parseInt(p.score)||0) }));
  if (raw.game && Array.isArray(raw.game.queue)){
    const queue = raw.game.queue.map(sanitizeTrack).filter(Boolean);
    const trackIdx = Math.max(0, parseInt(raw.game.trackIdx)||0);
    if (queue.length && trackIdx < queue.length){
      s.game = {
        queue, trackIdx,
        turn: Math.min(Math.max(0, parseInt(raw.game.turn)||0), s.players.length-1),
        round: Math.max(1, parseInt(raw.game.round)||1),
        totalSongs: queue.length,
        source: ["saavn","catalog","live"].includes(raw.game.source) ? raw.game.source : "catalog",
      };
      s.screen = "game"; // auto-resume: refresh drops you right back in
    }
  }
  return s;
}
const persist = s => lsSet(LS_KEY, { settings:s.settings, players:s.players, game:s.game });
function markPlayed(title){
  const l = lsGet(LS_PLAYED) || [];
  l.push(stripParens(title).toLowerCase());
  while (l.length > 400) l.shift();
  lsSet(LS_PLAYED, l);
}

/* ═══════ Song loading ═══════
   Primary: JioSaavn mirror (full songs, snippets start at the intro).
   Fallback 1: catalog.json baked into the site (rebuilt weekly by CI, 30s hook clips).
   Fallback 2: live iTunes search, throttled to stay under Apple's rate limit. */
let saavnBase = null;
async function saavnFetch(path){
  const bases = saavnBase ? [saavnBase] : SAAVN_BASES;
  for (const b of bases){
    try {
      const ctl = new AbortController();
      const to = setTimeout(()=>ctl.abort(), 6000);
      const r = await fetch(b + path, { signal: ctl.signal });
      clearTimeout(to);
      if (!r.ok) continue;
      const j = await r.json();
      if (j && (j.data || j.results)){ saavnBase = b; return j; }
    } catch(e){}
  }
  return null;
}
const pickStream = dl => {
  if (!Array.isArray(dl)) return null;
  for (const q of ["96kbps","160kbps","48kbps","320kbps","12kbps"]){
    const hit = dl.find(x=>x.quality===q); if (hit && (hit.url||hit.link)) return hit.url||hit.link;
  }
  const any = dl.find(x=>x.url||x.link); return any ? (any.url||any.link) : null;
};
const pickArt = img => Array.isArray(img) && img.length ? (img[img.length-1].url||img[img.length-1].link||null) : null;

async function loadFromSaavn(langs){
  const jobs = [];
  for (const lang of langs) for (const q of shuffle(SAAVN_QUERIES[lang]).slice(0,7)) jobs.push({q,lang});
  const seen = new Set(); const pool = [];
  const results = await Promise.allSettled(jobs.map(j =>
    saavnFetch(`/search/songs?query=${encodeURIComponent(j.q)}&limit=40`).then(r=>({r, lang:j.lang}))
  ));
  for (const res of results){
    if (res.status!=="fulfilled" || !res.value.r) continue;
    const lang = res.value.lang;
    const list = res.value.r.data?.results || res.value.r.results || [];
    for (const s of list){
      const name = de(s.name || s.title || "");
      if (!name) continue;
      if ((s.language||"").toLowerCase() !== (lang==="bolly"?"hindi":"telugu")) continue;
      const year = parseInt(s.year) || 0;
      if (year < 2000) continue;
      if (EXCLUDE_RX.test(name)) continue;
      const stream = safeUrl(pickStream(s.downloadUrl));
      if (!stream) continue;
      const key = stripParens(name).toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      const artists = (s.artists?.primary || []).map(a=>de(a.name)).filter(Boolean);
      pool.push(sanitizeTrack({
        title:name, artist:artists.slice(0,3).join(", ")||"Unknown artist",
        album:de(s.album?.name||""), art:pickArt(s.image), stream,
        duration:parseInt(s.duration)||200, year, lang,
      }));
    }
  }
  return pool.filter(Boolean);
}
async function loadCatalog(langs){
  try {
    const r = await fetch("./catalog.json", { cache:"no-cache" });
    if (!r.ok) return [];
    const j = await r.json();
    const tracks = (Array.isArray(j.tracks) ? j.tracks : []).map(t=>sanitizeTrack({ ...t, hook:true })).filter(Boolean);
    return tracks.filter(t => langs.includes(t.lang));
  } catch(e){ return []; }
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = "cb_"+Math.random().toString(36).slice(2);
    window[cb] = data => { resolve(data); cleanup(); };
    const s = document.createElement("script");
    s.src = url + "&callback=" + cb;
    s.onerror = () => { reject(new Error("jsonp failed")); cleanup(); };
    function cleanup(){ delete window[cb]; s.remove(); }
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ reject(new Error("timeout")); cleanup(); } }, 8000);
  });
}
const itunesSearch = (term, limit) => {
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&country=IN&limit=${limit||40}`;
  return fetch(url).then(r=>r.json()).catch(()=> jsonp(url));
};
async function loadFromItunes(langs){
  const jobs = [];
  // Keep the request count low: iTunes rate-limits around 20 searches/min per IP,
  // and a failed attempt needs headroom for the user to retry within a minute.
  for (const lang of langs) for (const t of shuffle(ITUNES_TERMS[lang]).slice(0, langs.length>1 ? 5 : 8)) jobs.push({t,lang});
  const settled = await Promise.allSettled(jobs.map(j=>itunesSearch(j.t)));
  const seen = new Set(); const pool = [];
  settled.forEach((res, idx) => {
    if (res.status!=="fulfilled" || !res.value || !res.value.results) return;
    const lang = jobs[idx].lang;
    for (const s of res.value.results){
      if (!s.previewUrl || !s.trackName) continue;
      if (EXCLUDE_RX.test(s.trackName)) continue;
      const g = (s.primaryGenreName||"").toLowerCase();
      if (!ITUNES_LANG_OK[lang].some(k=>g.includes(k))) continue;
      const year = s.releaseDate ? new Date(s.releaseDate).getFullYear() : 0;
      if (year < 2000) continue;
      const key = stripParens(s.trackName).toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      pool.push(sanitizeTrack({
        title:s.trackName, artist:s.artistName||"Unknown artist", album:s.collectionName||"",
        art:s.artworkUrl100 ? s.artworkUrl100.replace("100x100","400x400") : null,
        stream:s.previewUrl, duration:30, year, lang, hook:true,
      }));
    }
  });
  return pool.filter(Boolean);
}
async function buildCrate(mix){
  const langs = mix==="both" ? ["bolly","telugu"] : [mix];
  const key = t => stripParens(t.title).toLowerCase();
  let pool = await loadFromSaavn(langs);
  let source = "saavn";
  if (pool.length < 10){
    const keys = new Set(pool.map(key));
    const backup = (await loadCatalog(langs)).filter(t=>!keys.has(key(t)));
    if (!pool.length) source = "catalog";
    pool = pool.concat(backup);
  }
  if (pool.length < 10){
    const keys = new Set(pool.map(key));
    const live = (await loadFromItunes(langs)).filter(t=>!keys.has(key(t)));
    if (!pool.length) source = "live";
    pool = pool.concat(live);
  }
  if (pool.length < 10) return null;
  const played = new Set(lsGet(LS_PLAYED) || []);
  const fresh = pool.filter(t => !played.has(stripParens(t.title).toLowerCase()));
  if (fresh.length >= 15) pool = fresh;
  return { queue: shuffle(pool), source };
}

/* ═══════ Audio engine — the ONLY owner of playback ═══════
   Every action bumps `session`. Any async continuation from an older session
   is ignored, so two songs can never play at once. */
const engine = {
  ctx:null, el:null, srcNode:null, timer:null, session:0,
  cache:{ url:null, buf:null },
  ac(){
    if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  stop(){
    this.session++;
    if (this.timer){ clearTimeout(this.timer); this.timer = null; }
    if (this.srcNode){ try{ this.srcNode.stop(); }catch(e){} this.srcNode = null; }
    if (this.el){ this.el.pause(); }
  },
  trim(buf, secs){
    const c = this.ac();
    const len = Math.min(buf.length, Math.floor(secs * buf.sampleRate));
    const nb = c.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
    for (let ch=0; ch<buf.numberOfChannels; ch++) nb.copyToChannel(buf.getChannelData(ch).subarray(0,len), ch);
    return nb;
  },
  async ensureBuf(url){
    if (this.cache.url === url && this.cache.buf) return this.cache.buf;
    const res = await fetch(url);
    const ab = await res.arrayBuffer();
    const full = await this.ac().decodeAudioData(ab);
    const buf = this.trim(full, 45);
    this.cache = { url, buf };
    return buf;
  },
  prefetch(url){ if (url) this.ensureBuf(url).catch(()=>{}); },
  /* returns "played" | "failed" | "superseded" */
  async playMuffled(url, offset, secs, onEnd){
    this.stop();
    const s = this.session;
    let buf;
    try { buf = await this.ensureBuf(url); } catch(e){ return (s===this.session) ? "failed" : "superseded"; }
    if (s !== this.session) return "superseded";
    if (offset >= buf.duration - 1) return "failed";
    const c = this.ac();
    const src = c.createBufferSource(); src.buffer = buf;
    const out = c.createGain();
    const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=140;
    const lpG = c.createGain(); lpG.gain.value=0.9;
    src.connect(lp); lp.connect(lpG); lpG.connect(out);
    let mainIn;
    if (buf.numberOfChannels >= 2){
      const sp = c.createChannelSplitter(2);
      const gL = c.createGain(); gL.gain.value = 1;
      const gR = c.createGain(); gR.gain.value = -1;
      const diff = c.createGain(); diff.gain.value = 1.8;
      src.connect(sp); sp.connect(gL,0); sp.connect(gR,1);
      gL.connect(diff); gR.connect(diff);
      mainIn = diff;
    } else { mainIn = c.createGain(); src.connect(mainIn); }
    const cut1 = c.createBiquadFilter(); cut1.type="peaking"; cut1.frequency.value=1200; cut1.Q.value=0.9; cut1.gain.value=-10;
    const cut2 = c.createBiquadFilter(); cut2.type="peaking"; cut2.frequency.value=3000; cut2.Q.value=0.9; cut2.gain.value=-9;
    const hiLp = c.createBiquadFilter(); hiLp.type="lowpass"; hiLp.frequency.value=6500;
    mainIn.connect(cut1); cut1.connect(cut2); cut2.connect(hiLp); hiLp.connect(out);
    out.connect(c.destination);
    src.start(0, offset, secs);
    this.srcNode = src;
    this.timer = setTimeout(()=>{ if (s === this.session) onEnd && onEnd(); }, secs*1000);
    return "played";
  },
  playElement(url, offset, secs, onEnd){
    this.stop();
    const s = this.session;
    if (!this.el || this.el.dataset.src !== url){
      this.el = new Audio(url);
      this.el.preload = "auto";
      this.el.dataset.src = url;
    }
    const el = this.el;
    const go = () => {
      if (s !== this.session) return; // superseded while loading — never plays
      try { el.currentTime = offset; } catch(e){}
      const p = el.play(); if (p) p.catch(()=>{});
      if (secs) this.timer = setTimeout(()=>{ if (s === this.session){ el.pause(); onEnd && onEnd(); } }, secs*1000);
    };
    if (el.readyState >= 1) go();
    else el.addEventListener("loadedmetadata", go, { once:true });
  },
};

/* ═══════ Wake lock ═══════ */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock){ wakeLock.release(); wakeLock = null; }
  } catch(e){}
}

/* ═══════ App ═══════ */
function App(){
  const [state, setState] = useState(loadPersisted);
  const [phase, setPhase] = useState("ready");        // ready | cueing | playing | guessing | revealed
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [note, setNote] = useState("");
  const [showBoard, setShowBoard] = useState(false);
  const [snip, setSnip] = useState({ end:0, lastSecs:10, playSecs:0 });

  useEffect(()=>{ persist(state); }, [state]);
  useEffect(()=>{
    keepAwake(state.screen === "game");
    const vis = ()=>{ if (document.visibilityState==="visible") keepAwake(state.screen==="game"); };
    document.addEventListener("visibilitychange", vis);
    return ()=>document.removeEventListener("visibilitychange", vis);
  }, [state.screen]);

  const S = state.settings;
  const g = state.game;
  const track = g ? g.queue[g.trackIdx] : null;

  const upSettings = patch => setState(st=>({ ...st, settings:{ ...st.settings, ...patch } }));

  async function startGame(){
    engine.stop();
    setLoading(true); setError("");
    const crate = await buildCrate(S.mix);
    setLoading(false);
    if (!crate){ setError("Couldn't load enough songs. Check your connection and try again."); return; }
    setPhase("ready"); setNote(""); setSnip({ end:0, lastSecs:S.snippetLen, playSecs:0 });
    setState(st=>({ ...st, screen:"game",
      players: st.players.map(p=>({ ...p, score:0 })),
      game:{ queue:crate.queue, trackIdx:0, turn:0, round:1, totalSongs:crate.queue.length, source:crate.source } }));
    if (S.sound==="inst") engine.prefetch(crate.queue[0].stream);
  }

  async function playSnippet(secs, mode){ // mode: fresh | replay | extend
    if (!track) return;
    engine.ac(); // unlock inside the tap
    const offset = mode==="extend" ? snip.end : 0;
    const nextSnip = { end: offset + secs, lastSecs: mode==="extend" ? snip.lastSecs : secs, playSecs: secs };
    setNote("");
    const done = ()=>setPhase("guessing");
    if (S.sound === "inst"){
      setPhase("cueing");
      const r = await engine.playMuffled(track.stream, offset, secs, done);
      if (r === "superseded") return;         // user did something newer; obey them
      if (r === "played"){ setSnip(nextSnip); setPhase("playing"); return; }
      setNote("Couldn't process this one — playing it as-is.");
    }
    setSnip(nextSnip);
    setPhase("playing");
    engine.playElement(track.stream, offset, secs, done);
  }

  function revealTrack(){
    if (!track) return;
    const offset = track.duration > 35 ? Math.min(45, Math.max(0, track.duration - 60)) : 0;
    engine.playElement(track.stream, offset, 0, null);
    setPhase("revealed");
  }

  function nextRound(gotIt){
    engine.stop();
    if (track) markPlayed(track.title);
    setPhase("ready"); setNote(""); setShowBoard(false);
    setSnip(s=>({ ...s, end:0, playSecs:0 }));
    setState(st=>{
      const gg = st.game;
      const players = gotIt===true
        ? st.players.map((p,i)=> i===gg.turn ? { ...p, score:p.score+1 } : p)
        : st.players;
      const turn = gotIt===null ? gg.turn : (gg.turn+1) % players.length; // skip keeps the same player
      const round = (gotIt!==null && turn===0) ? gg.round+1 : gg.round;
      const trackIdx = gg.trackIdx + 1;
      if (trackIdx >= gg.queue.length) return { ...st, players, screen:"done", game:null };
      return { ...st, players, game:{ ...gg, trackIdx, turn, round } };
    });
  }
  useEffect(()=>{ // prefetch the upcoming track whenever it changes
    if (state.screen==="game" && track && S.sound==="inst") engine.prefetch(track.stream);
  }, [g && g.trackIdx, state.screen]);

  function endGame(){
    if (!confirm("End this game? Scores will be cleared.")) return;
    engine.stop();
    setState(st=>({ ...st, screen:"setup", game:null }));
  }

  /* ——— UI pieces ——— */
  const Chip = (p) => html`<button class="chip ${p.on ? "on-"+(p.tone||"gold") : ""}" onClick=${p.onClick}>${p.children}</button>`;
  const Disc = (p) => html`
    <div class="disc-wrap">
      <div class="disc ${p.spinning?"spinning":""}" style=${p.art ? `background-image:url('${p.art}')` : ""}>
        ${!p.art && html`<div class="disc-hole">?</div>`}
      </div>
    </div>`;

  if (state.screen === "setup"){
    if (loading) return html`
      <div class="wrap center" style="padding-top:20vh">
        <${Disc} spinning=${true} />
        <div class="display" style="font-size:22px;font-weight:700;margin-top:12px">Digging through the crates…</div>
        <div class="sub" style="margin-top:6px">Loading songs</div>
      </div>`;
    return html`
      <div class="wrap">
        <div class="center" style="margin:24px 0 28px">
          <div class="eyebrow">PASS-THE-PHONE PARTY GAME</div>
          <h1>Tune<span style="color:var(--rose)">Teasers</span></h1>
          <p class="sub">Hear the melody. Shout the song. Claim the point.</p>
        </div>
        ${error && html`<div class="card" style="border:1.5px solid var(--rose)"><div class="sub">${error}</div></div>`}
        <div class="card">
          <div class="label">MUSIC MIX · songs from 2000 onwards</div>
          <div class="chips">
            <${Chip} on=${S.mix==="bolly"} tone="rose" onClick=${()=>upSettings({mix:"bolly"})}>Bollywood<//>
            <${Chip} on=${S.mix==="telugu"} tone="teal" onClick=${()=>upSettings({mix:"telugu"})}>Telugu<//>
            <${Chip} on=${S.mix==="both"} onClick=${()=>upSettings({mix:"both"})}>Both<//>
          </div>
        </div>
        <div class="card">
          <div class="label">SOUND</div>
          <div class="chips">
            <${Chip} on=${S.sound==="inst"} onClick=${()=>upSettings({sound:"inst"})}>🎻 Music only<//>
            <${Chip} on=${S.sound==="full"} onClick=${()=>upSettings({sound:"full"})}>🎤 With vocals<//>
          </div>
          ${S.sound==="inst" && html`<div class="sub" style="font-size:12px;margin-top:8px">Snippets play with vocals muffled, so the melody does the teasing.</div>`}
        </div>
        <div class="card">
          <div class="label">SNIPPET LENGTH</div>
          <div class="chips">
            ${[5,10,15].map(s=>html`<${Chip} on=${S.snippetLen===s} onClick=${()=>upSettings({snippetLen:s})}>${s}s<//>`)}
          </div>
        </div>
        <div class="card">
          <div class="label">PLAYERS</div>
          ${state.players.map((p,i)=>html`
            <div class="prow" key=${i}>
              <input type="text" value=${p.name}
                onInput=${e=>setState(st=>({ ...st, players: st.players.map((q,j)=> j===i ? {...q, name:e.target.value.slice(0,24)} : q) }))} />
              ${state.players.length>1 && html`<button class="xbtn" aria-label="Remove player"
                onClick=${()=>setState(st=>({ ...st, players: st.players.filter((_,j)=>j!==i) }))}>✕</button>`}
            </div>`)}
          ${state.players.length<8 && html`<button class="btn btn-ghost" style="padding:10px"
            onClick=${()=>setState(st=>({ ...st, players:[...st.players, {name:"Player "+(st.players.length+1), score:0}] }))}>+ Add player</button>`}
        </div>
        <button class="btn btn-gold pulse" style="font-size:19px" onClick=${startGame}>Start the game</button>
      </div>`;
  }

  if (state.screen === "done"){
    const ranked = [...state.players].sort((a,b)=>b.score-a.score);
    return html`
      <div class="wrap center" style="padding-top:16vh">
        <div style="font-size:46px">🏆</div>
        <h2 class="display" style="font-size:30px;font-weight:800;margin:6px 0 18px">${ranked[0].name} takes it!</h2>
        <div class="card" style="text-align:left">
          ${ranked.map((p,i)=>html`
            <div class="boardrow" style="font-weight:${i===0?800:600};color:${i===0?'var(--marigold)':'var(--cream)'};${i<ranked.length-1?'border-bottom:1px solid var(--surface2)':''}">
              <span>${i+1}. ${p.name}</span><span>${p.score}</span>
            </div>`)}
        </div>
        <button class="btn btn-gold" onClick=${startGame}>Play again</button>
        <div class="gap"></div>
        <button class="btn btn-ghost" onClick=${()=>setState(st=>({ ...st, screen:"setup" }))}>Change settings</button>
      </div>`;
  }

  /* game screen */
  const cur = state.players[g.turn];
  const spinning = phase==="playing" || phase==="revealed";
  const revealed = phase==="revealed";
  return html`
    <div class="wrap">
      <div class="topbar">
        <div class="sub" style="font-size:13px;font-weight:600">Round ${g.round}</div>
        <button class="scorebtn" onClick=${()=>setShowBoard(v=>!v)}>${showBoard?"Hide scores":"Scores"}</button>
      </div>
      ${showBoard && html`<div class="card" style="padding:12px;margin-bottom:10px">
        ${state.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score).map(({p,i})=>html`
          <div class="boardrow" style="font-weight:${i===g.turn?800:500};color:${i===g.turn?'var(--marigold)':'var(--cream)'}">
            <span>${p.name}${i===g.turn?" ← up now":""}</span><span>${p.score}</span>
          </div>`)}
      </div>`}
      <div class="turnbar">
        <div class="tag">PHONE GOES TO</div>
        <div class="who">${cur.name}</div>
      </div>
      <${Disc} spinning=${spinning} art=${revealed && track ? track.art : null} />
      ${phase==="playing" && snip.playSecs>0 && html`
        <div class="progress"><div style="animation: fill ${snip.playSecs}s linear forwards"></div></div>`}
      ${phase==="ready" && html`
        <p class="center sub" style="margin-bottom:14px">Everyone quiet — ${cur.name}, hit play when ready.</p>
        <button class="btn btn-gold" onClick=${()=>playSnippet(S.snippetLen, "fresh")}>▶ Play ${S.snippetLen}-second snippet</button>
        <div class="gap"></div>
        <button class="btn btn-ghost" onClick=${()=>nextRound(null)}>Skip this song</button>`}
      ${phase==="cueing" && html`
        <p class="center display" style="font-size:18px;font-weight:700;margin-bottom:14px">Cueing it up…</p>
        <button class="btn btn-dark" disabled>One sec</button>`}
      ${phase==="playing" && html`
        <p class="center display" style="font-size:20px;font-weight:700;margin-bottom:14px">Listen closely… 🎧</p>
        ${note && html`<div class="notice" style="margin:-6px 0 12px">${note}</div>`}
        <button class="btn btn-rose" onClick=${revealTrack}>I know it! Reveal</button>`}
      ${phase==="guessing" && html`
        <p class="center sub" style="margin-bottom:14px">Say your guess out loud, then reveal.</p>
        <button class="btn btn-rose" onClick=${revealTrack}>Reveal the song</button>
        <div class="gap"></div>
        <div class="row2">
          <button class="btn btn-ghost" onClick=${()=>playSnippet(snip.lastSecs, "replay")}>🔁 Replay</button>
          <button class="btn btn-ghost" onClick=${()=>playSnippet(5, "extend")}>＋5 more secs</button>
        </div>`}
      ${revealed && track && html`
        <div class="center" style="margin-bottom:16px">
          <div class="answer-title">${track.title}</div>
          <div class="answer-artist">${track.artist}</div>
          ${track.album && html`<div class="answer-album">${track.album}${track.year ? ` · ${track.year}` : ""}</div>`}
        </div>
        <div class="row2">
          <button class="btn btn-teal" onClick=${()=>nextRound(true)}>✓ Got it (+1)</button>
          <button class="btn btn-dark" onClick=${()=>nextRound(false)}>✗ Missed</button>
        </div>`}
      <div class="footnote">
        Song ${Math.min(g.trackIdx+1, g.totalSongs)} of ${g.totalSongs} in the crate
        ${track ? ` · ${track.lang==="bolly" ? "Bollywood" : "Telugu"}` : ""}
        ${g.source==="live" ? " · live search" : ""}
        <br/><a href="#" onClick=${e=>{e.preventDefault(); endGame();}}>End game</a>
      </div>
    </div>`;
}
render(h(App), document.getElementById("root"));
</script>
</body>
</html>
