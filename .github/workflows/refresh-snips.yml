name: Refresh snips index

on:
  schedule:
    - cron: "30 4 * * 2"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-snips.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet public/snips.json; then
            echo "Snips unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/snips.json
          git commit -m "Refresh snips index"
          git push
