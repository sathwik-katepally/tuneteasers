name: Refresh snips index

# Nightly: scores the corpus songs that still have no vocal-stem curves, in
# as many resumable shards as that backlog needs (each stops taking songs
# after 5 hours and keeps what it scored), then merges and commits. Once the
# curves cover the corpus the merge publishes the v5 index by itself; until
# then it refreshes the v4 one. Nights with nothing to score only refresh.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Scoring runners (default: one per 35 songs without curves, at most 40, 20 at a time)"
        default: ""
      limit:
        description: "Songs each runner scores at most (each also stops taking songs after 5 hours)"
        default: "300"

permissions:
  contents: read

concurrency:
  group: refresh-snips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          SNIP_PLAN: "1"
        run: |
          todo=$(node scripts/build-snips.mjs | sed -n 's/^todo=//p')
          echo "songs without curves: $todo"
          echo "shards=$(node -e 'const todo = +process.argv[1] || 0; const n = parseInt(process.env.SHARDS) || (todo ? Math.min(40, Math.ceil(todo / 35)) : 0); console.log(JSON.stringify([...Array(Math.min(40, n)).keys()]))' "$todo")" >> "$GITHUB_OUTPUT"

  score:
    needs: [plan]
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-snips.txt
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install -r scripts/requirements-snips.txt
      # Separator and Whisper weights (~2 GB), downloaded once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tt-snips-models
          key: snips-models-${{ hashFiles('scripts/vocal-curve.py', 'scripts/requirements-snips.txt') }}
          restore-keys: snips-models-
      - run: mkdir -p shard && cp public/snips.json shard/snips.json && cp scripts/voice-curves.json shard/voice-curves.json
      - run: node scripts/build-snips.mjs
        env:
          SNIP_OUT: shard/snips.json
          SNIP_CURVES: shard/voice-curves.json
          SNIP_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          SNIP_LIMIT: ${{ inputs.limit || '300' }}
          SNIP_BUDGET_MIN: "300"
      - uses: actions/upload-artifact@v7
        with:
          name: snips-shard-${{ matrix.shard }}
          path: |
            shard/snips.json
            shard/voice-curves.json
          retention-days: 3

  # A shard that failed only leaves its songs unexamined for the next run.
  merge:
    needs: [plan, score]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The branch tip, not the commit that started this hours-long run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Nothing to download on a night with nothing to score.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: snips-shard-*
          path: shards
      - run: mkdir -p shards
      - run: node scripts/build-snips.mjs
        env:
          SNIP_MERGE: shards
      - run: scripts/push-data-commit.sh "Refresh snips index" public/snips.json scripts/voice-curves.json

  # Phone alert on failure (ntfy, topic in the NTFY_TOPIC repo secret).
  # failure() is false for a cancelled run, so a superseded run stays quiet;
  # a run dispatched on a branch is an experiment and does not page.
  alert:
    needs: [plan, score, merge]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >-
          curl -s --max-time 20
          -H "Title: ${{ github.repository }}/${{ github.workflow }} failed"
          -H "Priority: high" -H "Tags: x"
          -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "https://ntfy.sh/$NTFY_TOPIC"
