name: Refresh song corpus

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-corpus.mjs
      - id: commit
        name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet public/corpus.json; then
            echo "Corpus unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/corpus.json
          git commit -m "Refresh song corpus"
          scripts/land-bot-commit.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A new corpus needs its snips index: hand over to the snips workflow, which
  # scores only the songs it has not seen and commits the result.
  snips:
    needs: [refresh]
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-snips.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  # Phone alert on failure (ntfy, topic in the NTFY_TOPIC repo secret).
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [refresh, snips]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >-
          curl -s --max-time 20
          -H "Title: ${{ github.repository }}/${{ github.workflow }} failed"
          -H "Priority: high" -H "Tags: x"
          -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "https://ntfy.sh/$NTFY_TOPIC"
