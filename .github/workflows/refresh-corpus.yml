name: Refresh song corpus

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-corpus.mjs
      - id: commit
        run: scripts/push-data-commit.sh "Refresh song corpus" public/corpus.json

  # A new corpus needs its snips index: hand over to the snips workflow, which
  # scores only the songs it has not seen and commits the result.
  snips:
    needs: [refresh]
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-snips.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  # Slack #jobs alert on failure, through alert.yml.
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [refresh, snips]
    if: failure()
    uses: ./.github/workflows/alert.yml
    secrets:
      SLACK_WEBHOOK_JOBS: ${{ secrets.SLACK_WEBHOOK_JOBS }}
