name: Refresh song catalog

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet public/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json
          git commit -m "Refresh song catalog"
          git push

  # Phone alert on failure (ntfy, topic in the NTFY_TOPIC repo secret).
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [refresh]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: >-
          curl -s --max-time 20
          -H "Title: ${{ github.repository }}/${{ github.workflow }} failed"
          -H "Priority: high" -H "Tags: x"
          -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "https://ntfy.sh/$NTFY_TOPIC"
