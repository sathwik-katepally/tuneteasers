name: Refresh song catalog

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - run: scripts/push-data-commit.sh "Refresh song catalog" public/catalog.json

  # Slack #jobs alert on failure, through alert.yml.
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [refresh]
    if: failure()
    uses: ./.github/workflows/alert.yml
    secrets:
      SLACK_WEBHOOK_JOBS: ${{ secrets.SLACK_WEBHOOK_JOBS }}
