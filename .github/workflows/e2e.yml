name: E2E

# The key Playwright suites in e2e/ against a production build, one job per
# suite so they run side by side. e2e-release.yml adds the rest of the release
# matrix on main and nightly. docs/testing-and-deploy.md, "E2E in CI", has the
# measurements behind the runner split.
#
# Phone WebKit that plays songs runs on macOS: Linux WebKit's GStreamer
# backend stops delivering audio after any seek once a stream has played.
# Desktop Chromium runs on Linux: on the macOS runners its media clock runs at
# about half speed, so a clip outlasts every wait. The buzz room runs on Linux
# too, since only its desktop host plays audio, in Playwright's Docker image.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  key:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: game phone
            os: macos-latest
            browsers: webkit
            run: npm run e2e:game -- --profile=phone
          - name: game desktop
            os: ubuntu-latest
            browsers: chromium
            run: npm run e2e:game -- --profile=desktop --mode=teams --difficulty=easy
          - name: safe snips phone
            os: macos-latest
            browsers: webkit
            run: npm run e2e:snips -- --profile=phone
          - name: safe snips desktop
            os: ubuntu-latest
            browsers: chromium
            run: npm run e2e:snips -- --profile=desktop
          # The phone ladder is left out: its 150ms "Now playing" hand-off check
          # misses by 160-290ms on the loaded macOS runners. Run it locally.
          - name: ladder desktop
            os: ubuntu-latest
            browsers: chromium
            run: >-
              npm run e2e:ladder -- --profile=desktop --difficulty=easy &&
              npm run e2e:ladder -- --profile=desktop --difficulty=medium
          - name: group sync
            os: macos-latest
            worker: true
            run: npm run e2e:group
          - name: landing and journeys
            os: macos-latest
            run: >-
              npm run e2e:landing -- --profile=phone &&
              npm run e2e:landing -- --profile=desktop &&
              npm run e2e:journeys
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          browsers: ${{ matrix.browsers || 'webkit chromium' }}
          worker: ${{ matrix.worker || false }}
      - run: uptime
      - run: ${{ matrix.run }}

  # Playwright's Docker image, tagged with the Playwright version in
  # package-lock.json: an image from another release has no matching browsers.
  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      image: mcr.microsoft.com/playwright:v${{ steps.v.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"

  # The buzz room runs in that image, which ships WebKit's and Chromium's
  # system libraries: installing them from Ubuntu's mirror on every run
  # sometimes outlasted the job's time limit.
  room:
    name: buzz room
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      # Chromium needs more shared memory than Docker's default 64MB.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          worker: true
      - run: cat /proc/loadavg
      - run: npm run e2e:room && npm run e2e:room-background

  # Slack alert when main or the nightly run breaks (#jobs, the ops app's bot
  # token in the SLACK_BOT_TOKEN repo secret). Pull requests show their own red check.
  alert:
    needs: [key, room]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        # bash for pipefail: without it the pipe would hide a post that --fail rejected.
        shell: bash
        run: |
          run="$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(gh api "repos/$run/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
          # The token reaches curl in a config file, not on its command line, and
          # Slack answers 200 with ok: false for a bad token or channel.
          jq -n --arg text "$GITHUB_REPOSITORY/$GITHUB_WORKFLOW failed (${failed:-job unknown}): $GITHUB_SERVER_URL/$run" \
            '{channel: "#jobs", text: $text, unfurl_links: false}' |
            curl -sS --fail --max-time 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$SLACK_BOT_TOKEN") \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @- https://slack.com/api/chat.postMessage |
            jq -e '.ok or error(.error)'
