name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [E2E]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Only a push run, since a fork's pull request from a branch named main
    # also matches the branch filter, and only while its commit is still
    # main's tip (github.sha), so a late rerun of an older commit cannot roll
    # production back. deploy needs this job, so a skip here skips both.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha)
    # A newer build cancels an older one, so the deploys reach the pages group
    # in the order their runs started.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Cloudflare Web Analytics beacon token (a repo variable, not a secret:
      # it ships in the HTML). Unset means the beacon is not rendered at all.
      - run: npm run build
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A job of its own, so re-running it after a failed deploy reuses the one
  # artifact; a re-run that uploads again leaves two and deploy-pages refuses.
  deploy:
    needs: build
    # On the job, not the workflow: a skipped run must not cancel a deploy.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A re-run keeps the run's github.sha, so only main's live tip shows that
      # a newer push has landed since and this deploy would roll it back.
      - id: tip
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $tip now, so $TESTED is not deployed"
          fi
      - id: deployment
        if: github.event_name != 'workflow_run' || steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@v5

  # Slack alert on failure (#jobs, the ops app's bot token in the SLACK_BOT_TOKEN repo secret).
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        # bash for pipefail: without it the pipe would hide a post that --fail rejected.
        shell: bash
        run: |
          run="$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(gh api "repos/$run/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
          # The token reaches curl in a config file, not on its command line, and
          # Slack answers 200 with ok: false for a bad token or channel.
          jq -n --arg text "$GITHUB_REPOSITORY/$GITHUB_WORKFLOW failed (${failed:-job unknown}): $GITHUB_SERVER_URL/$run" \
            '{channel: "#jobs", text: $text, unfurl_links: false}' |
            curl -sS --fail --max-time 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$SLACK_BOT_TOKEN") \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @- https://slack.com/api/chat.postMessage |
            jq -e '.ok or error(.error)'
