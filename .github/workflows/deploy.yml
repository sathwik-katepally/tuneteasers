name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Cloudflare Web Analytics beacon token (a repo variable, not a secret:
      # it ships in the HTML). Unset means the beacon is not rendered at all.
      - run: npm run build
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # Slack alert on failure (#jobs, the ops app's bot token in the SLACK_BOT_TOKEN repo secret).
  # failure() is false for a cancelled run, so a superseded run stays quiet.
  alert:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        # bash for pipefail: without it the pipe would hide a post that --fail rejected.
        shell: bash
        run: |
          run="$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=$(gh api "repos/$run/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
          # The token reaches curl in a config file, not on its command line, and
          # Slack answers 200 with ok: false for a bad token or channel.
          jq -n --arg text "$GITHUB_REPOSITORY/$GITHUB_WORKFLOW failed (${failed:-job unknown}): $GITHUB_SERVER_URL/$run" \
            '{channel: "#jobs", text: $text, unfurl_links: false}' |
            curl -sS --fail --max-time 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$SLACK_BOT_TOKEN") \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @- https://slack.com/api/chat.postMessage |
            jq -e '.ok or error(.error)'
