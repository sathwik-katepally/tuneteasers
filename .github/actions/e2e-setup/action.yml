name: E2E setup
description: Node deps, a production build, the Playwright browsers for this runner, and optionally the Worker's deps for wrangler dev.
inputs:
  worker:
    description: Also install worker/ dependencies (suites that start wrangler dev).
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          worker/package-lock.json
    - run: npm ci
      shell: bash
    - if: inputs.worker == 'true'
      run: npm ci
      working-directory: worker
      shell: bash
    - run: npm run build
      shell: bash
    # Linux jobs drive the runner's Google Chrome (see CHROMIUM_CHANNEL in
    # e2e/harness.mjs) and need no download. macOS jobs run Playwright's
    # WebKit and Chromium, which play the AAC streams there.
    - if: runner.os == 'macOS'
      id: pw
      run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
    - if: runner.os == 'macOS'
      run: npx playwright install webkit chromium
      shell: bash
